<svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Cursor-hand asset — REPLACE THIS FILE to swap the icon that
    follows the mouse.

    IMPORTANT: this is loaded via <img src="..."> (see CursorHand.tsx),
    which treats the SVG as an isolated image document — it does NOT
    inherit `color` from the page, so `currentColor` silently resolves
    to black. On a dark site that's invisible-on-invisible. Use an
    explicit hex fill instead (this one matches the site's #ff4500
    accent) or swap it per mode/theme by editing the fill value below.
  -->
  <rect x="9" y="2" width="4" height="12" rx="2" fill="#ff4500" />
  <rect x="6" y="11" width="12" height="10" rx="5" fill="#ff4500" />
  <rect x="2" y="13" width="6" height="4.5" rx="2.25" fill="#ff4500" />
</svg>
