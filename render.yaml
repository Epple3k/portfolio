services:
  - type: web
    name: ledgerline-finance
    runtime: node
    plan: free
    rootDir: ledgerline-plugin
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: LEDGERLINE_USER_AGENT
        sync: false
      - key: OPENAI_APPS_CHALLENGE
        sync: false
