services:
  - type: web
    name: signal-intelligence-api
    runtime: python
    repo: https://github.com/Epple3k/portfolio
    branch: signal-public-v1
    rootDir: signal
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OMP_NUM_THREADS
        value: 1
      - key: OPENBLAS_NUM_THREADS
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: signal-intelligence-db
          property: connectionString
