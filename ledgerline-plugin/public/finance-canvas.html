<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ledgerline Finance Canvas</title>
  <style>
    :root{
      color-scheme:light dark;
      --ll-acid:#c8ff38;
      --ll-ink:var(--color-text-primary,#111);
      --ll-muted:var(--color-text-secondary,#6b6b63);
      --ll-bg:var(--color-background-primary,#f7f6f0);
      --ll-panel:var(--color-background-secondary,#efeee8);
      --ll-line:var(--color-border-secondary,rgba(0,0,0,.15));
      --ll-font:var(--font-sans,Inter,ui-sans-serif,system-ui,sans-serif);
      --ll-mono:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);
    }
    *{box-sizing:border-box}
    body{margin:0;background:transparent;color:var(--ll-ink);font-family:var(--ll-font)}
    button{font:inherit;color:inherit}
    .card{border:1px solid var(--ll-line);border-radius:16px;overflow:hidden;background:var(--ll-bg);min-height:380px}
    .top{display:flex;justify-content:space-between;gap:16px;padding:18px 18px 14px;border-bottom:1px solid var(--ll-line)}
    .brand{display:flex;align-items:center;gap:10px}
    .mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--ll-ink);color:var(--ll-acid);font:800 10px/1 var(--ll-mono)}
    .title{font-size:20px;font-weight:650;letter-spacing:-.03em;line-height:1.05}
    .subtitle{margin-top:5px;color:var(--ll-muted);font-size:12px}
    .actions{display:flex;gap:7px;align-items:flex-start}
    .tinybtn,.tab{border:1px solid var(--ll-line);background:transparent;border-radius:999px;padding:6px 9px;font:650 10px/1 var(--ll-mono);cursor:pointer}
    .tinybtn:hover,.tinybtn.active,.tab:hover,.tab.active{background:var(--ll-ink);color:var(--ll-acid)}
    .tabs{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid var(--ll-line);background:var(--ll-panel)}
    .view{display:none}.view.active{display:block}
    .chart-wrap{position:relative;padding:14px 13px 10px;min-height:230px;overflow-x:auto;overscroll-behavior-x:contain}
    svg{display:block;width:100%;min-width:610px;height:250px;overflow:visible}
    .axis{stroke:var(--ll-line);stroke-width:1}
    .grid{stroke:var(--ll-line);stroke-width:1;stroke-dasharray:3 5}
    .line{fill:none;stroke-width:2.25;vector-effect:non-scaling-stroke}
    .point{stroke:var(--ll-bg);stroke-width:2;cursor:pointer}.point:focus-visible,.bar:focus-visible{stroke:var(--ll-ink);stroke-width:3;outline:none}
    .bar{cursor:pointer}
    .tick{fill:var(--ll-muted);font:9px var(--ll-mono)}
    .legend{display:flex;flex-wrap:wrap;gap:11px;padding:0 18px 14px}
    .legend-item{display:flex;align-items:center;gap:6px;font:600 10px/1 var(--ll-mono)}
    .swatch{width:9px;height:9px;border-radius:3px}
    .inspect{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-top:1px solid var(--ll-line);background:var(--ll-panel)}.inspect .links{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.inspect strong,.inspect span{overflow-wrap:anywhere}
    .inspect strong{display:block;font-size:13px}
    .inspect span{display:block;margin-top:4px;color:var(--ll-muted);font:10px/1.35 var(--ll-mono)}
    .inspect a{align-self:center;color:inherit;text-decoration:none;border-bottom:1px solid currentColor;font:700 9px/1 var(--ll-mono)}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--ll-line);vertical-align:top}
    th{font:700 9px/1 var(--ll-mono);text-transform:uppercase;letter-spacing:.05em;background:var(--ll-panel);position:sticky;top:0}
    td.num{text-align:right;font-family:var(--ll-mono);font-variant-numeric:tabular-nums}
    .table-scroll{max-height:310px;overflow:auto}
    .sources{padding:14px}
    .source,.note{border:1px solid var(--ll-line);border-radius:12px;padding:12px;margin-bottom:9px}
    .source a,.note a{color:inherit;font-weight:650}
    .source strong,.note strong{display:block;font-size:12px;margin-bottom:5px}
    .source p,.note p{margin:0;color:var(--ll-muted);font-size:11px;line-height:1.45}
    .empty{padding:42px 18px;text-align:center;color:var(--ll-muted);font-size:12px}
    .metricbar{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 12px}
    .metric{border:1px solid var(--ll-line);border-radius:10px;padding:8px 10px;background:var(--ll-panel)}
    .metric b{display:block;font:700 13px/1 var(--ll-mono)}
    .metric small{display:block;margin-top:4px;color:var(--ll-muted);font:600 9px/1 var(--ll-mono)}
    body.fullscreen .card{border-radius:0;min-height:100vh}
    body.fullscreen svg{height:min(55vh,520px)}
    @media(max-width:560px){.top{padding:12px;gap:8px}.actions{display:flex;flex-wrap:wrap;justify-content:flex-end}.tinybtn{font-size:9px;padding:6px}.title{font-size:16px}.subtitle{font-size:11px}.chart-wrap{padding-left:7px;padding-right:7px}.inspect{grid-template-columns:1fr;gap:8px}.metricbar{gap:5px}.metric{flex:1;min-width:100px}}
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="brand">
        <div class="mark">LL</div>
        <div>
          <div class="title" id="title">Ledgerline</div>
          <div class="subtitle" id="subtitle">Finance-native analysis</div>
        </div>
      </div>
      <div class="actions">
        <button class="tinybtn" id="indexBtn" title="Index each series to 100">INDEX 100</button>
        <button class="tinybtn" id="fullBtn" style="display:none">EXPAND</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="chart">CHART</button>
      <button class="tab" data-tab="table">TABLE</button>
      <button class="tab" data-tab="sources">SOURCES</button>
    </div>
    <section class="view active" id="chart">
      <div class="chart-wrap"><svg id="svg" viewBox="0 0 900 250" role="img" aria-label="Interactive financial chart. Select plotted values to inspect their sources."></svg></div>
      <div class="metricbar" id="metricbar"></div>
      <div class="legend" id="legend"></div>
      <div class="inspect" id="inspect">
        <div><strong>Select a point</strong><span>Click a plotted value to inspect its source and context.</span></div>
      </div>
    </section>
    <section class="view" id="table"><div class="table-scroll" id="tableScroll"></div></section>
    <section class="view" id="sources"><div class="sources" id="sourcesList"></div></section>
  </div>

  <script type="module">
    import {
      App,
      PostMessageTransport,
      applyDocumentTheme,
      applyHostStyleVariables,
      applyHostFonts
    } from "https://esm.sh/@modelcontextprotocol/ext-apps@1.0.1";

    const palette = ["#6d5dfc","#0e9f6e","#e08a00","#d6496a","#3787d9","#8a5a2b","#7b61a8","#477b31"];
    let payload = null;
    let indexed = false;
    let currentMode = "inline";

    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

    function compact(n){
      const a=Math.abs(n);
      if(a>=1e12)return (n/1e12).toFixed(2)+"T";
      if(a>=1e9)return (n/1e9).toFixed(2)+"B";
      if(a>=1e6)return (n/1e6).toFixed(2)+"M";
      if(a>=1e3)return (n/1e3).toFixed(1)+"K";
      return Number(n.toFixed(2)).toLocaleString();
    }
    function displayValue(n, unit){
      if(unit==="%") return compact(n)+"%";
      if(unit==="USD") return "$"+compact(n);
      if(unit==="USD/shares") return "$"+Number(n.toFixed(2));
      return compact(n)+(unit && unit!=="shares" ? " "+unit : "");
    }
    function normalizedSeries(){
      if(!payload?.series) return [];
      return payload.series.map(s=>{
        if(!indexed) return s;
        const base=s.points.find(p=>Number.isFinite(p.y))?.y;
        if(!Number.isFinite(base)||base===0) return s;
        return {...s,unit:"index",points:s.points.map(p=>({...p,originalY:p.y,originalUnit:s.unit,y:p.y/base*100}))};
      });
    }
    function safeUrl(value){
      try{const u=new URL(String(value));return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return ""}
    }
    function allX(series){
      const seen=new Set(), out=[];
      for(const s of series) for(const p of s.points){const k=String(p.x);if(!seen.has(k)){seen.add(k);out.push(k)}}
      return out.sort();
    }
    function svgEl(name, attrs={}){
      const el=document.createElementNS("http://www.w3.org/2000/svg",name);
      for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,String(v));
      return el;
    }
    function interactiveMark(el,s,p,total){
      el.setAttribute("tabindex","0");el.setAttribute("role","button");
      el.setAttribute("aria-label",s.name+" "+p.x+" "+displayValue(p.y,s.unit));
      const title=svgEl("title");title.textContent=s.name+" · "+p.x+" · "+displayValue(p.y,s.unit);el.appendChild(title);
      const activate=()=>inspectPoint(s,p,total);
      el.addEventListener("click",activate);
      el.addEventListener("keydown",event=>{
        if(event.key==="Enter"||event.key===" "){event.preventDefault();activate()}
      });
    }
    function renderChart(){
      const svg=$("#svg");svg.innerHTML="";
      const series=normalizedSeries(),xs=allX(series);
      if(!series.length||!series.some(s=>s.points.some(p=>Number.isFinite(p.y)))){
        const empty=svgEl("text",{x:450,y:125,"text-anchor":"middle",class:"tick"});
        empty.textContent="No chartable observations";
        svg.appendChild(empty);$("#legend").textContent="";$("#metricbar").textContent="";return;
      }
      const waterfall=payload.chartType==="waterfall",grouped=new Map();
      series.forEach((item,i)=>{
        const key=waterfall?item.name:(item.unit||"value");
        if(!grouped.has(key))grouped.set(key,[]);
        grouped.get(key).push({item,i});
      });
      const width=900,part=230,fullHeight=grouped.size*part,left=70,right=25;
      svg.setAttribute("viewBox","0 0 "+width+" "+fullHeight);
      svg.style.height=fullHeight+"px";
      const xPos=x=>left+xs.indexOf(String(x))/Math.max(1,xs.length-1)*(width-left-right);
      [...grouped.entries()].forEach(([unit,records],groupIndex)=>{
        const offset=groupIndex*part,top=offset+35,bottom=offset+part-38,range=bottom-top;
        const heading=svgEl("text",{x:left,y:offset+17,class:"tick"});
        heading.textContent=unit+(grouped.size>1?" · SEPARATE SCALE":"");
        svg.appendChild(heading);
        const values=[];
        for(const {item} of records){
          if(waterfall){
            let sum=0;values.push(sum);
            for(const p of item.points.filter(p=>Number.isFinite(p.y))){sum+=p.y;values.push(sum)}
          }else values.push(...item.points.map(p=>p.y).filter(Number.isFinite));
        }
        if(!values.length)return;
        if(waterfall||payload.chartType==="bar")values.push(0);
        let lo=Math.min(...values),hi=Math.max(...values);
        if(lo===hi){lo-=1;hi+=1}
        if(payload.chartType==="line"){const pad=(hi-lo)*.07;lo-=pad;hi+=pad}
        const yPos=y=>top+(hi-y)/(hi-lo)*range;
        for(let t=0;t<5;t++){
          const y=top+t*range/4,v=hi-t*(hi-lo)/4;
          svg.appendChild(svgEl("line",{x1:left,x2:width-right,y1:y,y2:y,class:"grid"}));
          const txt=svgEl("text",{x:left-9,y:y+3,"text-anchor":"end",class:"tick"});txt.textContent=compact(v);svg.appendChild(txt);
        }
        if(lo<=0&&hi>=0)svg.appendChild(svgEl("line",{x1:left,x2:width-right,y1:yPos(0),y2:yPos(0),class:"axis"}));
        const tickEvery=Math.max(1,Math.ceil(xs.length/7));
        xs.forEach((x,i)=>{
          if(i%tickEvery!==0&&i!==xs.length-1)return;
          const t=svgEl("text",{x:xPos(x),y:offset+part-13,"text-anchor":"middle",class:"tick"});
          t.textContent=x.length>10?x.slice(0,10):x;svg.appendChild(t);
        });
        records.forEach(({item,i},slot)=>{
          const pts=item.points.filter(p=>Number.isFinite(p.y)).sort((a,b)=>String(a.x).localeCompare(String(b.x)));
          const paint=palette[i%palette.length];
          if(waterfall){
            let running=0,prevX=null;
            const barW=Math.max(10,Math.min(36,(width-left-right)/Math.max(2,xs.length*1.7)));
            pts.forEach(p=>{
              const next=running+p.y,x=xPos(p.x),a=yPos(running),b=yPos(next);
              if(prevX!==null)svg.appendChild(svgEl("line",{x1:prevX+barW/2,x2:x-barW/2,y1:a,y2:a,class:"axis"}));
              const rect=svgEl("rect",{x:x-barW/2,y:Math.min(a,b),width:barW,height:Math.max(1,Math.abs(a-b)),rx:2,fill:paint,class:"bar"});
              interactiveMark(rect,item,p,next);svg.appendChild(rect);running=next;prevX=x;
            });
          }else if(payload.chartType==="bar"){
            const barW=Math.max(4,Math.min(30,(width-left-right)/Math.max(2,xs.length*(records.length+1))));
            pts.forEach(p=>{
              const x=xPos(p.x)+(slot-(records.length-1)/2)*(barW+3),a=yPos(p.y),b=yPos(0);
              const rect=svgEl("rect",{x:x-barW/2,y:Math.min(a,b),width:barW,height:Math.max(1,Math.abs(a-b)),rx:2,fill:paint,class:"bar"});
              interactiveMark(rect,item,p);svg.appendChild(rect);
            });
          }else{
            const d=pts.map((p,i)=>(i?"L":"M")+xPos(p.x)+","+yPos(p.y)).join(" ");
            svg.appendChild(svgEl("path",{d,class:"line",stroke:paint}));
            pts.forEach(p=>{
              const dot=svgEl("circle",{cx:xPos(p.x),cy:yPos(p.y),r:5.5,fill:paint,class:"point"});
              interactiveMark(dot,item,p);svg.appendChild(dot);
            });
          }
        });
      });
      $("#legend").innerHTML=series.map((s,i)=>'<div class="legend-item"><span class="swatch" style="background:'+palette[i%palette.length]+'"></span>'+esc(s.name)+' · '+esc(s.unit||"value")+'</div>').join("");
      $("#metricbar").innerHTML=series.map(s=>{
        const pts=s.points.filter(p=>Number.isFinite(p.y)),last=pts.at(-1),prev=pts.at(-2);
        const delta=last&&prev&&prev.y!==0?(last.y/prev.y-1)*100:null;
        return '<div class="metric"><b>'+(last?esc(displayValue(last.y,s.unit)):"—")+'</b><small>'+esc(s.name)+(delta!==null?' · '+(delta>=0?"+":"")+delta.toFixed(1)+"%":"")+'</small></div>';
      }).join("");
    }
    function inspectPoint(series,point,total){
      const inspect=$("#inspect");inspect.replaceChildren();
      const info=document.createElement("div"),strong=document.createElement("strong"),detail=document.createElement("span");
      strong.textContent=series.name+" · "+point.x+" · "+displayValue(point.y,series.unit);
      const parts=[];
      if(point.originalY!==undefined)parts.push("Reported "+displayValue(point.originalY,point.originalUnit));
      if(point.meta?.concept)parts.push("XBRL "+point.meta.concept);
      if(point.meta?.form)parts.push(point.meta.form);
      if(point.meta?.filed)parts.push("Filed "+point.meta.filed);
      if(point.meta?.accession)parts.push("Accession "+point.meta.accession);
      if(point.meta?.derived)parts.push("Q4 derived: full year minus nine-month YTD");
      if(total!==undefined)parts.push("Running total "+displayValue(total,series.unit));
      if(point.source&&!point.meta?.accession)parts.push(point.source);
      if(point.note&&!point.meta?.concept)parts.push(point.note);
      detail.textContent=parts.join(" · ")||"No source metadata provided";
      info.append(strong,detail);inspect.appendChild(info);
      const links=document.createElement("div");links.className="links";
      const addLink=(url,label)=>{
        const href=safeUrl(url);if(!href)return;
        const a=document.createElement("a");a.href=href;a.target="_blank";a.rel="noopener noreferrer";a.textContent=label;links.appendChild(a);
      };
      addLink(point.sourceUrl,"OPEN FILING ↗");
      if(point.meta?.derived)addLink(point.meta.secondSourceUrl,"OPEN 9-MO FILING ↗");
      if(links.children.length)inspect.appendChild(links);
    }
    function renderTable(){
      const series=normalizedSeries(), xs=allX(series);
      const rows=xs.map(x=>[x,...series.map(s=>s.points.find(p=>String(p.x)===x)?.y)]);
      $("#tableScroll").innerHTML=`<table><thead><tr><th>Period</th>${series.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td>${r.slice(1).map((v,i)=>`<td class="num">${Number.isFinite(v)?esc(displayValue(v,indexed?"index":series[i].unit)):"—"}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }
    function renderSources(){
      const sources=payload?.sources||[], notes=payload?.notes||[];
      const a=sources.map(s=>`<div class="source"><strong>${safeUrl(s.url)?`<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noreferrer">${esc(s.label)} ↗</a>`:esc(s.label)}</strong><p>${esc(s.detail||"")}</p></div>`).join("");
      const b=notes.map(n=>`<div class="note"><strong>${safeUrl(n.url)?`<a href="${esc(safeUrl(n.url))}" target="_blank" rel="noreferrer">${esc(n.title)} ↗</a>`:esc(n.title)}</strong><p>${esc(n.text||"")}</p></div>`).join("");
      $("#sourcesList").innerHTML=(a+b)||'<div class="empty">No source metadata was supplied with this view.</div>';
    }
    function render(){
      if(!payload)return;
      $("#title").textContent=payload.title||"Ledgerline";
      $("#subtitle").textContent=payload.subtitle||"Financial analysis";
      renderChart();renderTable();renderSources();
    }

    document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
      document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===btn));
      document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===btn.dataset.tab));
    }));
    $("#indexBtn").addEventListener("click",()=>{
      if(!indexed&&payload?.series?.some(s=>s.points.find(p=>Number.isFinite(p.y))?.y===0)){
        $("#inspect").textContent="Index 100 is unavailable when a series begins at zero.";return;
      }
      indexed=!indexed;$("#indexBtn").classList.toggle("active",indexed);render();
    });

    const app=new App({name:"Ledgerline Finance Canvas",version:"0.1.0"});
    app.ontoolresult=(result)=>{payload=result.structuredContent||null;render()};
    app.onhostcontextchanged=(ctx)=>{
      if(ctx.theme)applyDocumentTheme(ctx.theme);
      if(ctx.styles?.variables)applyHostStyleVariables(ctx.styles.variables);
      if(ctx.styles?.css?.fonts)applyHostFonts(ctx.styles.css.fonts);
      if(ctx.safeAreaInsets){
        const {top,right,bottom,left}=ctx.safeAreaInsets;
        document.body.style.padding=`${top}px ${right}px ${bottom}px ${left}px`;
      }
      if(ctx.availableDisplayModes?.includes("fullscreen"))$("#fullBtn").style.display="";
      if(ctx.displayMode){currentMode=ctx.displayMode;document.body.classList.toggle("fullscreen",ctx.displayMode==="fullscreen")}
    };
    app.onteardown=async()=>({});
    $("#fullBtn").addEventListener("click",async()=>{
      const next=currentMode==="fullscreen"?"inline":"fullscreen";
      const result=await app.requestDisplayMode({mode:next});
      currentMode=result.mode;
      document.body.classList.toggle("fullscreen",currentMode==="fullscreen");
      $("#fullBtn").textContent=currentMode==="fullscreen"?"COLLAPSE":"EXPAND";
    });
    await app.connect(new PostMessageTransport());
  </script>
</body>
</html>
