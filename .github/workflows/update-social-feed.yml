name: Update social feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-social-feed.mjs"
      - ".github/workflows/update-social-feed.yml"
      - "public/manual-social.json"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aggregate Letterboxd and Goodreads
        run: node scripts/update-social-feed.mjs

      - name: Commit feed changes
        run: |
          if git diff --quiet -- public/social-feed.json; then
            echo "No social feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social-feed.json
          git commit -m "Update social feed"
          git push
