name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update social feed", "Validate generative portfolio"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
        env:
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}

      # Publish the experimental edition beside the original production build.
      # Its source is isolated on a feature branch; the main homepage stays unchanged.
      - uses: actions/checkout@v4
        with:
          ref: feature/generative-portfolio
          path: generative-source
          lfs: true

      - run: pnpm install --no-frozen-lockfile
        working-directory: generative-source

      # Relative asset URLs support GitHub Pages' /portfolio/generative/
      # as well as custom-domain /generative/ paths.
      - run: pnpm run build
        working-directory: generative-source
        env:
          VITE_SITE_BASE: "./"
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}

      - run: mkdir -p dist/generative && cp -a generative-source/dist/. dist/generative/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
