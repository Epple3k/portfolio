name: Deploy mail worker

on:
  push:
    branches: [main, professional-presentation-cleanup, blog-mailing-cloudflare]
    paths:
      - "mail-worker/**"
      - ".github/workflows/deploy-mail-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail-worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
