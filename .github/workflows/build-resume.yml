name: Build portfolio resume PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-resume.py"
      - ".github/workflows/build-resume.yml"

permissions:
  contents: write

concurrency:
  group: resume-pdf-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF builder
        run: python -m pip install reportlab==4.4.3
      - name: Render one-page resume
        run: python scripts/build-resume.py
      - name: Commit updated resume PDF
        run: |
          git add public/Emit_Rice_Resume.pdf
          if git diff --cached --quiet; then
            echo "Resume already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh hosted resume PDF"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "Could not publish resume after three attempts" >&2
          exit 1
